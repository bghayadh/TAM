# Place this file in src/main/resources/graphhopper.properties
# (or point @PropertySource in GraphHopperSpringConfig to another location).
# Every value is optional: if a line is missing, the default inside the code is used.

# Source OpenStreetMap data. Only read when the graph cache folder is empty.
graphhopper.osm.file=C:/GraphHopper/gcc-states-260919.osm.pbf

# Folder with the prepared graph. GraphHopper creates it automatically.
# To rebuild: stop TAM, delete this folder (NOT the PBF), start TAM, then call the
# route endpoint once. The import takes minutes and needs a large heap (about -Xmx8g),
# so do it once before users start using the system.
graphhopper.graph.location=C:/GraphHopper/graph-cache-foot

# Routing profile name used in requests.
graphhopper.profile=drop_cable

# Distance in meters from the road centerline to the cable (about half the road width plus a bit).
graphhopper.cable.offset.meters=0

# Last-resort side when it cannot be calculated from the geometry: 1 = left, -1 = right
# (in travel direction). Normally the side comes from where the handhole is.
graphhopper.cable.default.side=1

# If a footway/path/pedestrian way exists within this many meters of the handhole or
# the destination, the route starts/ends on it instead of on the nearest road.
# 0 = disabled. Sensible range: 10-20.
graphhopper.snap.footway.max.meters=15

#diagnostic mode
graphhopper.debug.alternatives=true